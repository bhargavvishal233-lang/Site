<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; background: #eee; }
  .scene { width: 800px; height: 400px; perspective: 1000px; display: flex; align-items: center; justify-content: center; }
  .carousel { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; animation: spin 20s infinite linear; }
  .item { position: absolute; width: 200px; height: 300px; background: red; left: 300px; top: 50px; border: 2px solid black; box-sizing: border-box; text-align: center; font-size: 50px; line-height: 300px; color: white;}
  
  /* Convex */
  /* .item { transform: rotateY(var(--r)) translateZ(400px); } */
  
  /* Concave */
  .item { transform: rotateY(var(--r)) translateZ(-400px); }
  
  @keyframes spin { 100% { transform: rotateY(-360deg); } }
</style>
</head>
<body>
<div class="scene">
  <div class="carousel">
    <div class="item" style="--r: 0deg; background: red;">1</div>
    <div class="item" style="--r: 60deg; background: blue;">2</div>
    <div class="item" style="--r: 120deg; background: green;">3</div>
    <div class="item" style="--r: 180deg; background: yellow;">4</div>
    <div class="item" style="--r: 240deg; background: purple;">5</div>
    <div class="item" style="--r: 300deg; background: orange;">6</div>
  </div>
</div>
</body>
</html>
